<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aplikasi Penilaian Gerak Jalan</title>

<!-- =========================================================================
     CARA PAKAI (BACA INI DULU)
     =========================================================================
     File ini HANYA "jendela" yang menampilkan aplikasi asli dari Google Apps
     Script secara penuh layar. Isi aplikasinya (fitur, tampilan, dsb) SELALU
     diambil langsung dari link deploy Apps Script setiap kali halaman ini
     dibuka — jadi:

        - Ada perubahan fitur/tampilan di Apps Script?
          -> CUKUP update Code.gs / Index.html di Apps Script editor & simpan
             seperti biasa. File index.html di GitHub ini TIDAK PERLU disentuh
             sama sekali. Cukup refresh browser untuk lihat versi terbaru.

        - Link deploy Apps Script-nya sendiri yang berubah (misal Anda
          membuat deployment baru dari awal, bukan "Manage Deployments >
          Edit > New Version")?
          -> Baru di sini, di GitHub, Anda perlu ganti SATU baris di bawah
             ini (variabel DEPLOY_URL), lalu upload ulang file ini.

     Supaya link deploy jarang berubah, saat deploy di Apps Script gunakan:
     Deploy > Manage deployments > (pilih deployment aktif) > Edit (ikon
     pensil) > pilih "New version" > Deploy.
     JANGAN klik "New deployment" (itu akan membuat link BARU yang beda).
     ========================================================================= -->

<script>
    // >>> GANTI HANYA BARIS INI KALAU LINK DEPLOY APPS SCRIPT ANDA BERUBAH <<<
    const DEPLOY_URL = "https://script.google.com/macros/s/AKfycbwrcmE74e-QX8ELjaeM5JhLOAkLtHpmjr0GOljKGygYrLoOD4a3huRP8CKUQ5uiX9F9/exec";
</script>

<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    }

    /* Iframe mengisi seluruh layar & otomatis menyesuaikan ukuran perangkat
       (HP, tablet, laptop) karena browser menghitung ulang 100vw/100vh
       setiap kali ukuran viewport berubah — dan aplikasi di dalamnya sendiri
       memang sudah dibangun responsif mengikuti lebar layar ini. */
    #appFrame {
        position: fixed; top: 0; left: 0;
        width: 100vw; height: 100vh;
        border: 0; display: block;
        background: #f8fafc;
    }

    #loadingScreen {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: #4338ca; color: #fff;
        transition: opacity .35s ease;
    }
    #loadingScreen.hide { opacity: 0; pointer-events: none; }
    .spinner {
        width: 40px; height: 40px; border-radius: 50%;
        border: 4px solid rgba(255,255,255,0.25); border-top-color: #fff;
        animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingScreen p { font-size: 13px; font-weight: 600; letter-spacing: .3px; opacity: .9; }

    #fallbackScreen {
        position: fixed; inset: 0; z-index: 20;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: #f8fafc; color: #334155; text-align: center; padding: 24px;
    }
    #fallbackScreen.show { display: flex; }
    #fallbackScreen h2 { margin: 0; font-size: 17px; color: #1e293b; }
    #fallbackScreen p { margin: 0; font-size: 13px; color: #64748b; max-width: 360px; line-height: 1.5; }
    #fallbackScreen a {
        margin-top: 6px; text-decoration: none; background: #4338ca; color: #fff;
        font-weight: 700; font-size: 14px; padding: 12px 22px; border-radius: 10px;
        box-shadow: 0 4px 12px rgba(67,56,202,.25);
    }
    #openNewTabBar {
        position: fixed; bottom: 14px; right: 14px; z-index: 15;
        background: rgba(15,23,42,.85); color: #fff; font-size: 11px; font-weight: 600;
        padding: 8px 12px; border-radius: 999px; text-decoration: none;
        display: flex; align-items: center; gap: 6px; backdrop-filter: blur(4px);
    }
</style>
</head>
<body>

    <div id="loadingScreen">
        <div class="spinner"></div>
        <p>Memuat Aplikasi Penilaian Gerak Jalan…</p>
    </div>

    <div id="fallbackScreen">
        <h2>Aplikasi belum bisa ditampilkan di sini</h2>
        <p>Link deploy belum diisi, sudah tidak aktif, atau browser Anda memblokir tampilan tertanam. Silakan buka aplikasi langsung lewat tombol di bawah ini.</p>
        <a id="fallbackOpenLink" href="#" target="_blank" rel="noopener">Buka Aplikasi</a>
    </div>

    <iframe id="appFrame" title="Aplikasi Penilaian Gerak Jalan" allow="clipboard-write"></iframe>

    <a id="openNewTabBar" href="#" target="_blank" rel="noopener">
        <span>&#8599;</span> Buka di Tab Baru
    </a>

<script>
    const frame = document.getElementById('appFrame');
    const loadingScreen = document.getElementById('loadingScreen');
    const fallbackScreen = document.getElementById('fallbackScreen');
    const fallbackLink = document.getElementById('fallbackOpenLink');
    const newTabBar = document.getElementById('openNewTabBar');

    const isUrlFilled = DEPLOY_URL && !DEPLOY_URL.includes('AKfycbxXkPCY3ji8WAnofV8g80OeiuRdWOb1RIbSHl0dy8LOMJaiLdgFfscqvEtjRotOU-6j');

    fallbackLink.href = DEPLOY_URL || '#';
    newTabBar.href = DEPLOY_URL || '#';

    function showFallback() {
        loadingScreen.classList.add('hide');
        fallbackScreen.classList.add('show');
        frame.style.display = 'none';
        newTabBar.style.display = 'none';
    }

    if (!isUrlFilled) {
        showFallback();
    } else {
        let loaded = false;

        frame.addEventListener('load', () => {
            loaded = true;
            loadingScreen.classList.add('hide');
        });

        frame.src = DEPLOY_URL;

        // Kalau dalam 8 detik iframe tidak pernah selesai loading (link salah/mati/diblokir),
        // tampilkan layar fallback dengan tombol buka langsung.
        setTimeout(() => { if (!loaded) showFallback(); }, 8000);
    }
</script>

</body>
</html>
