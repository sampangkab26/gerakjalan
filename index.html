<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aplikasi Penilaian Gerak Jalan</title>

<!-- =========================================================================
     CARA PAKAI (BACA INI DULU)
     =========================================================================
     Halaman ini otomatis MENGALIHKAN (redirect) ke aplikasi asli di Google
     Apps Script begitu dibuka — bukan menampilkannya di dalam jendela/iframe.
     Ini sengaja dipilih karena Google memblokir tampilan iframe untuk link
     Apps Script (halaman perantara di script.google.com miliknya sendiri
     tidak bisa diizinkan tampil di iframe, terlepas dari pengaturan apa pun
     di Code.gs Anda) — jadi redirect adalah cara paling andal.

     Yang perlu Anda lakukan tetap SAMA SEDERHANANYA seperti sebelumnya:

        - Ada perubahan fitur/tampilan di Apps Script?
          -> CUKUP update Code.gs / Index.html di Apps Script editor & simpan
             seperti biasa. File index.html di GitHub ini TIDAK PERLU disentuh.

        - Link deploy Apps Script-nya sendiri yang berubah?
          -> Baru di sini Anda ganti SATU baris di bawah ini (DEPLOY_URL),
             lalu upload ulang file ini ke GitHub.

     Supaya link deploy jarang berubah, saat deploy di Apps Script gunakan:
     Deploy > Manage deployments > (pilih deployment aktif) > Edit (ikon
     pensil) > pilih "New version" > Deploy. JANGAN klik "New deployment".
     ========================================================================= -->

<script>
    // >>> GANTI HANYA BARIS INI KALAU LINK DEPLOY APPS SCRIPT ANDA BERUBAH <<<
    const DEPLOY_URL = "https://script.google.com/macros/s/AKfycbwAdnXyMSk9WccPfbT9qY9MuSMw7534eb4MF6tk9Ppocw1UZpI9BZeNglYzCjmBhb78/exec";
</script>

<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #4338ca; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        display: flex; align-items: center; justify-content: center;
    }
    .wrap { text-align: center; color: #fff; padding: 24px; }
    .spinner {
        width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 16px;
        border: 4px solid rgba(255,255,255,0.25); border-top-color: #fff;
        animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .wrap p { font-size: 13px; font-weight: 600; letter-spacing: .3px; opacity: .9; margin: 0; }

    #fallbackScreen {
        display: none; text-align: center; color: #1e293b; padding: 24px; max-width: 380px;
    }
    #fallbackScreen.show { display: block; }
    #fallbackScreen h2 { margin: 0 0 8px; font-size: 17px; }
    #fallbackScreen p { margin: 0; font-size: 13px; color: #64748b; line-height: 1.5; }
    #fallbackScreen a {
        display: inline-block; margin-top: 14px; text-decoration: none; background: #fff; color: #4338ca;
        font-weight: 700; font-size: 14px; padding: 12px 22px; border-radius: 10px;
    }
</style>
</head>
<body>

    <div class="wrap" id="loadingScreen">
        <div class="spinner"></div>
        <p>Mengalihkan ke Aplikasi Penilaian Gerak Jalan…</p>
    </div>

    <div id="fallbackScreen">
        <h2>Link deploy belum diisi</h2>
        <p>Buka file index.html ini, isi variabel DEPLOY_URL dengan link deploy Apps Script Anda, lalu upload ulang.</p>
    </div>

<script>
    const isUrlFilled = DEPLOY_URL && !DEPLOY_URL.includes('AKfycbwAdnXyMSk9WccPfbT9qY9MuSMw7534eb4MF6tk9Ppocw1UZpI9BZeNglYzCjmBhb78');

    if (!isUrlFilled) {
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('fallbackScreen').classList.add('show');
    } else {
        // replace() dipakai supaya halaman wrapper ini tidak masuk riwayat "Back" browser
        window.location.replace(DEPLOY_URL);
    }
</script>

</body>
</html>
